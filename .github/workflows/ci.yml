name: ci
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - uses: actions/cache@v4.2.0
        with:
          key: ${{ github.ref }}
          path: .cache
      - run: pip install -r requirements-docs.txt
      - run: mkdocs gh-deploy --force
